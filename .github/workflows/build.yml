name: build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    # matrix.label keeps required check names identical to the short image refs.
    name: build and test (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Devuan Excalibur is the target. Debian trixie is the base it is built on.
        # debian:trixie is pulled from the AWS public ECR mirror of Docker Hub
        # library images to avoid anonymous Docker Hub rate limits.
        include:
          - image: devuan/devuan:excalibur
            label: devuan/devuan:excalibur
          - image: public.ecr.aws/docker/library/debian:trixie
            label: debian:trixie
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # desktop-file must run here, not skip. The window suite does not.
      WRITE_IT_SMOKE_REQUIRED: 1
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            meson ninja-build g++ pkg-config \
            libgtkmm-3.0-dev \
            desktop-file-utils

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cat /etc/os-release
          meson --version
          g++ --version | head -n 1
          pkg-config --modversion gtkmm-3.0

      - name: Configure
        run: meson setup build

      - name: Compile
        run: meson compile -C build

      # Unit tests only. The desktop suite is suite ui, run locally.
      - name: Test
        run: meson test -C build --print-errorlogs --no-suite ui

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ strategy.job-index }}
          path: build/meson-logs/testlog.txt
          if-no-files-found: ignore
