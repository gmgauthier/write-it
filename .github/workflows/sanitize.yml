name: sanitize

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: ASan and UBSan (debian:trixie)
    runs-on: ubuntu-24.04
    # The same container and packages as build.yml's debian:trixie job.
    # Pulled from the AWS public ECR mirror of Docker Hub library images.
    container:
      image: public.ecr.aws/docker/library/debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      # smoke-open and desktop-file must run here, not skip.
      WRITE_IT_SMOKE_REQUIRED: 1
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            meson ninja-build g++ pkg-config \
            libgtkmm-3.0-dev \
            xvfb xauth \
            x11-utils dbus-daemon desktop-file-utils

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cat /etc/os-release
          meson --version
          g++ --version | head -n 1
          pkg-config --modversion gtkmm-3.0

      # GCC links its own sanitizer runtimes into every executable, so the
      # default -Db_lundef=true links cleanly and stays on.
      - name: Configure
        run: meson setup build-asan -Db_sanitize=address,undefined

      - name: Compile
        run: ninja -C build-asan

      # Every suite, the slow rtf-unicode-fuzz included. Any ASan or UBSan
      # report, or a leak not in tests/lsan.supp, aborts the test that hit it.
      # lsan.supp lists system libraries only; see the comment at its top.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # LSAN_OPTIONS is set in the shell: in a container job only the
        # shell's $GITHUB_WORKSPACE is the checkout's path inside the container.
        run: |
          export LSAN_OPTIONS="suppressions=$GITHUB_WORKSPACE/tests/lsan.supp:print_suppressions=0"
          test -r "$GITHUB_WORKSPACE/tests/lsan.supp"
          xvfb-run -a meson test -C build-asan --print-errorlogs --timeout-multiplier 4 --num-processes 2

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-asan-ubsan
          path: build-asan/meson-logs/testlog.txt
          if-no-files-found: ignore
